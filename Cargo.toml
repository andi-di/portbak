[package]
name = "portbak"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
anyhow = "1"
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
atomicwrites = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland"] }
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rustix = { version = "1", features = ["event", "fs"] }

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
