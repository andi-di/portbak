name: Release merged PR
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portbak-releases
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    if: github.event.deleted != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      published: ${{ steps.release.outputs.published }}
    steps:
      # Only merged commits reachable from main are executed with repository permissions.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merged commit
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
      - id: release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const { prepareRelease, cargoVersion } = require('./.github/scripts/release.cjs');
            await prepareRelease({ github, context, core }, cargoVersion(fs.readFileSync('Cargo.toml', 'utf8')));
  build:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build
        with:
          version: ${{ needs.prepare.outputs.version }}
      - name: Package executable and licenses
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: python .github/scripts/package_release.py --version "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const { publishRelease } = require('./.github/scripts/release.cjs');
            await publishRelease({ github, context }, {
              version: process.env.RELEASE_VERSION, directory: 'release-assets',
            });
