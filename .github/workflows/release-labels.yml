name: Validate release labels
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-labels:
    name: Validate release labels
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release version selection
        env:
          RELEASE_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: node -e "require('./.github/scripts/release.cjs').bumpVersion('0.1.0', JSON.parse(process.env.RELEASE_LABELS).map(label => label.name))"
