name: Validate and build
description: Shared checks and release build for CI and published binaries
inputs:
  version:
    description: Expected release version for Windows metadata verification
    default: ''
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
    - name: Test release helpers
      shell: bash
      run: node --test .github/scripts/release.test.cjs
    - name: Test release packaging
      shell: bash
      run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
    - name: Check Rust formatting
      shell: bash
      run: cargo fmt --check
    - name: Run Rust tests
      shell: bash
      run: cargo test --locked
    - name: Check Clippy warnings
      shell: bash
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Build release executable
      shell: bash
      run: cargo build --release --locked
    - name: Verify Windows release version
      if: runner.os == 'Windows' && inputs.version != ''
      shell: pwsh
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        $version = (Get-Item target/release/portbak.exe).VersionInfo
        if ($version.FileVersion -ne $env:EXPECTED_VERSION -or $version.ProductVersion -ne $env:EXPECTED_VERSION) {
          throw "Executable version metadata does not match the release"
        }
