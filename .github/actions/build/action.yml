name: Validate and build
description: Shared checks and release build for CI and published binaries
inputs:
  version:
    description: Release version override; empty uses Cargo.toml
    default: ''
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
    - uses: Swatinem/rust-cache@v2
    - shell: bash
      run: node --test .github/scripts/release.test.cjs
    - if: github.event_name == 'pull_request'
      shell: bash
      env:
        RELEASE_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
      run: node -e "require('./.github/scripts/release.cjs').bumpVersion('0.1.0', JSON.parse(process.env.RELEASE_LABELS).map(label => label.name))"
    - shell: bash
      run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
    - shell: bash
      run: cargo fmt --check
    - shell: bash
      run: cargo test --locked
    - shell: bash
      run: cargo clippy --locked --all-targets -- -D warnings
    - shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$RELEASE_VERSION" ]; then
          export PORTBAK_RELEASE_VERSION="$RELEASE_VERSION"
        fi
        cargo build --release --locked
    - if: runner.os == 'Windows' && inputs.version != ''
      shell: pwsh
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        $version = (Get-Item target/release/portbak.exe).VersionInfo
        if ($version.FileVersion -ne $env:EXPECTED_VERSION -or $version.ProductVersion -ne $env:EXPECTED_VERSION) {
          throw "Executable version metadata does not match the release"
        }
